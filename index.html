<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769e0"><link rel="manifest" href="./manifest.webmanifest">
<title>SRK's Sri Sai Heights</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#14213d}.app{max-width:600px;margin:auto;min-height:100vh}.top{background:#1769e0;color:#fff;padding:20px 17px 23px;border-radius:0 0 24px 24px}.top h1{margin:0;font-size:20px}.top p{margin:5px 0 0;font-size:13px;opacity:.9}.content{padding:15px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#f8faff}.stat small{color:#687386}.stat b{display:block;font-size:20px;margin-top:5px}.title{font-size:18px;font-weight:700;margin:5px 0 12px}.muted{font-size:12px;color:#687386}.btn{border:0;border-radius:11px;padding:12px 14px;background:#1769e0;color:white;font-weight:700}.btn2{border:1px solid #d7ddea;border-radius:11px;padding:11px 14px;background:white;color:#1769e0;font-weight:700}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d7ddea;border-radius:10px;font-size:15px}.field textarea{min-height:80px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700}.paid{background:#def5e5;color:#13813b}.pending{background:#fff0dc;color:#c96400}.new{background:#e7f0ff;color:#1769e0}.resolved{background:#def5e5;color:#13813b}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px;z-index:5}.nav button{border:0;background:white;font-size:10px;color:#687386;padding:7px 2px}.nav button.active{color:#1769e0;font-weight:700}.page{display:none}.page.active{display:block}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-card{width:100%;max-width:420px;background:#fff;padding:25px;border-radius:20px;box-shadow:0 4px 20px #0001}.login-logo{width:65px;height:65px;border-radius:18px;background:#1769e0;color:#fff;display:grid;place-items:center;font-size:28px;margin:auto auto 15px}.error{color:#b42318;font-size:13px;margin:8px 0}.item{padding:11px 0;border-bottom:1px solid #edf0f4}.item:last-child{border-bottom:0}
</style></head><body>
<div id="login" class="login"><div class="login-card">
<div class="login-logo">🏢</div><h2 style="text-align:center;margin:0">SRK's Sri Sai Heights</h2><p class="muted" style="text-align:center">Resident App</p>
<div class="field"><label>Flat Number</label><input id="flat" placeholder="e.g. G4" autocomplete="username"></div>
<div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN"></div>
<div id="loginErr" class="error"></div><button class="btn" style="width:100%" onclick="login()">Login</button>
</div></div>
<div id="app" class="app" style="display:none">
<header class="top"><button onclick="logout()" style="float:right;border:0;border-radius:8px;padding:7px 10px;color:#1769e0;background:#fff;font-weight:700">Logout</button><h1>SRK'S SRI SAI HEIGHTS</h1><p id="welcome"></p></header>
<main class="content">
<section id="home" class="page active">
<div class="card"><div class="title">Home</div><div class="grid"><div class="stat"><small>Maintenance</small><b id="homeAmt">₹—</b></div><div class="stat"><small>Status</small><b id="homeStatus">—</b></div></div></div>
<div class="card"><div class="title">Latest Announcements</div><div id="homeAnnouncements" class="muted">Loading…</div></div>
</section>
<section id="maintenance" class="page">
<div class="card"><div class="title">Maintenance</div><div id="maintenanceList">Loading…</div></div>
</section>
<section id="announcements" class="page">
<div class="card"><div class="title">Announcements</div><div id="announcementList">Loading…</div></div>
</section>
<section id="chat" class="page">
<div class="card"><div class="title">Community Chat</div><div id="chatList">Loading…</div>
<div class="field" style="margin-top:12px"><textarea id="chatMessage" placeholder="Write a message…"></textarea></div><button class="btn" onclick="sendChat()">Send</button></div>
</section>
<section id="complaints" class="page">
<div class="card"><div class="title">My Complaints</div><div id="complaintList">Loading…</div></div>
<div class="card"><div class="title">Raise Complaint</div>
<div class="field"><label>Category</label><select id="complaintCategory"><option>Maintenance</option><option>Water</option><option>Electrical</option><option>Security</option><option>Cleaning</option><option>Other</option></select></div>
<div class="field"><label>Description</label><textarea id="complaintText" placeholder="Describe the issue"></textarea></div>
<button class="btn" onclick="raiseComplaint()">Submit Complaint</button><div id="complaintMsg" class="muted" style="margin-top:8px"></div></div>
</section>
</main>
<nav class="nav">
<button class="active" onclick="showPage('home',this)">🏠<br>Home</button>
<button onclick="showPage('maintenance',this)">💰<br>Maintenance</button>
<button onclick="showPage('announcements',this)">📢<br>News</button>
<button onclick="showPage('chat',this)">💬<br>Chat</button>
<button onclick="showPage('complaints',this)">🛠️<br>Complaints</button>
</nav></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import{getFirestore,collection,getDocs,doc,getDoc,setDoc,addDoc,query,orderBy,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAIPpzzWEOTs5SW_CnV6D2wkc5k2Y5BxIM",authDomain:"srk-sri-sai-heights.firebaseapp.com",projectId:"srk-sri-sai-heights",storageBucket:"srk-sri-sai-heights.firebasestorage.app",messagingSenderId:"501758531689",appId:"1:501758531689:web:d88a6ffbd3409a868ceaf8"};
const db=getFirestore(initializeApp(firebaseConfig));let currentFlat="",currentName="";
const $=id=>document.getElementById(id);
window.login=async()=>{const f=$("flat").value.trim().toUpperCase(),p=$("pin").value.trim();$("loginErr").textContent="";try{const s=await getDoc(doc(db,"flats",f));if(!s.exists()||s.data().pin!==p||s.data().status==="inactive"){throw Error("Invalid flat number or PIN.")}currentFlat=f;currentName=s.data().residentName||"Resident";$("login").style.display="none";$("app").style.display="block";$("welcome").textContent=`Welcome, ${currentName} · Flat ${f}`;await loadAll()}catch(e){$("loginErr").textContent=e.message}};
window.logout=()=>location.reload();
window.showPage=(id,b)=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");};
async function loadAll(){await Promise.all([loadMaintenance(),loadAnnouncements(),loadChat(),loadComplaints()])}
async function loadMaintenance(){const s=await getDocs(collection(db,"maintenance"));let arr=s.docs.map(x=>x.data()).filter(x=>x.flatNumber===currentFlat).sort((a,b)=>(b.month||"").localeCompare(a.month||""));if(!arr.length){$("maintenanceList").textContent="No maintenance bills found.";return}let latest=arr[0];$("homeAmt").textContent="₹"+Number(latest.amount||0).toLocaleString("en-IN");$("homeStatus").textContent=(latest.status||"Pending").toUpperCase();$("maintenanceList").innerHTML=arr.map(m=>`<div class="item"><div class="row"><b>${esc(m.month||"Maintenance")}</b><span class="badge ${m.status==="paid"?"paid":"pending"}">${esc(m.status||"pending").toUpperCase()}</span></div><div class="muted">Amount: ₹${Number(m.amount||0).toLocaleString("en-IN")} · Due: ${esc(m.dueDate||"—")}</div>${m.paidDate?`<div class="muted">Paid: ${esc(m.paidDate)}</div>`:""}</div>`).join("")}
async function loadAnnouncements(){try{const s=await getDocs(query(collection(db,"announcements"),orderBy("createdAt","desc"),limit(20)));const a=s.docs.map(x=>x.data());const html=a.length?a.map(x=>`<div class="item"><b>${esc(x.title||"Announcement")}</b><div>${esc(x.message||"")}</div><div class="muted">${esc(x.date||"")}</div></div>`).join(""):"No announcements yet.";$("announcementList").innerHTML=html;$("homeAnnouncements").innerHTML=a.slice(0,3).map(x=>`<div class="item"><b>${esc(x.title||"Announcement")}</b><div>${esc(x.message||"")}</div></div>`).join("")||"No announcements yet."}catch(e){$("announcementList").textContent="No announcements yet.";$("homeAnnouncements").textContent="No announcements yet."}}
async function loadChat(){try{const s=await getDocs(query(collection(db,"chat"),orderBy("createdAt","desc"),limit(50)));const a=s.docs.map(x=>x.data()).reverse();$("chatList").innerHTML=a.map(x=>`<div class="item"><b>${esc(x.residentName||"Resident")} · ${esc(x.flatNumber||"")}</b><div>${esc(x.message||"")}</div><div class="muted">${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString("en-IN"): ""}</div></div>`).join("")||"No messages yet."}catch(e){$("chatList").textContent="Chat is not available yet."}}
window.sendChat=async()=>{const m=$("chatMessage").value.trim();if(!m)return;await addDoc(collection(db,"chat"),{flatNumber:currentFlat,residentName:currentName,message:m,createdAt:serverTimestamp()});$("chatMessage").value="";await loadChat()}
async function loadComplaints(){const s=await getDocs(collection(db,"complaints"));const a=s.docs.map(x=>x.data()).filter(x=>x.flatNumber===currentFlat).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$("complaintList").innerHTML=a.map(x=>`<div class="item"><div class="row"><b>${esc(x.category)}</b><span class="badge ${x.status==="Resolved"?"resolved":"new"}">${esc(x.status||"New")}</span></div><div>${esc(x.description)}</div><div class="muted">${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString("en-IN"):""}</div></div>`).join("")||"No complaints."; }
window.raiseComplaint=async()=>{const d=$("complaintText").value.trim();if(!d){$("complaintMsg").textContent="Enter a description.";return}await addDoc(collection(db,"complaints"),{flatNumber:currentFlat,residentName:currentName,category:$("complaintCategory").value,description:d,status:"New",createdAt:serverTimestamp()});$("complaintText").value="";$("complaintMsg").textContent="✓ Complaint submitted.";await loadComplaints()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script></body></html>
