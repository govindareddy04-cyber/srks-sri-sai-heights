<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769e0"><link rel="manifest" href="./manifest.webmanifest">
<title>SRK's Sri Sai Heights - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#14213d}.app{max-width:560px;margin:auto;min-height:100vh}
.top{background:#1769e0;color:#fff;padding:22px 18px 24px;border-radius:0 0 24px 24px}.top h1{font-size:20px;margin:0 0 4px}.top p{margin:0;font-size:13px;opacity:.9}.content{padding:15px 15px 30px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0001}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 10px #0001}.stat b{font-size:22px;display:block;margin-top:4px}
.muted{font-size:12px;color:#6d7789}.section-title{font-size:18px;font-weight:700;margin:8px 0 13px}.btn{border:0;border-radius:11px;padding:13px 15px;background:#1769e0;color:#fff;font-weight:700;font-size:14px}.btn2{border:1px solid #d8dee9;border-radius:11px;padding:12px 14px;background:#fff;color:#1769e0;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn,.actions .btn2{flex:1}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:10px;font-size:15px;background:#fff}.field textarea{min-height:85px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.flatrow{padding:12px 0;border-bottom:1px solid #edf0f4}.badge{padding:5px 9px;border-radius:18px;font-size:10px;font-weight:700}.paid{background:#def5e5;color:#13813b}.pending{background:#fff0dc;color:#c96400}.vacant{background:#edf0f5;color:#687386}.status{font-size:12px;margin-top:8px}.ok{color:#13813b}.err{color:#b42318}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f5f7fb}.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:27px 22px;box-shadow:0 4px 20px #0001}.login-logo{width:64px;height:64px;border-radius:18px;background:#1769e0;color:#fff;display:grid;place-items:center;font-size:29px;margin:0 auto 17px}.login h2{text-align:center;margin:0 0 5px}.login-sub{text-align:center;color:#6d7789;font-size:13px;margin-bottom:22px}.login-error{display:none;color:#b42318;font-size:13px;margin:8px 0}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="login-logo">🔐</div><h2>Admin Dashboard</h2><div class="login-sub">SRK'S SRI SAI HEIGHTS</div>
<div class="field"><label>Admin PIN</label><input id="adminPin" type="password" inputmode="numeric" placeholder="Enter admin PIN"></div>
<div id="loginErr" class="login-error"></div><button class="btn" style="width:100%" onclick="adminLogin()">Login</button>
<div class="muted" style="text-align:center;margin-top:12px">Current test PIN: 9999</div></div></div>

<div id="dashboard" class="app" style="display:none"><header class="top"><button onclick="logout()" style="float:right;border:0;border-radius:8px;padding:7px 10px;color:#1769e0;background:#fff;font-weight:700">Logout</button><h1>SRK'S SRI SAI HEIGHTS</h1><p>Admin Dashboard</p></header>
<main class="content">
<div class="stats"><div class="stat"><span class="muted">Total Flats</span><b id="totalFlats">—</b></div><div class="stat"><span class="muted">Paid</span><b id="paidCount">—</b></div><div class="stat"><span class="muted">Pending</span><b id="pendingCount">—</b></div><div class="stat"><span class="muted">Collection</span><b id="collection">₹—</b></div></div>

<div class="card"><div class="section-title">Maintenance</div><div class="actions"><button class="btn" onclick="createBills()">Create October ₹1,565 Bills</button><button class="btn2" onclick="loadDashboard()">Refresh</button></div><div id="actionStatus" class="status muted">Ready.</div></div>

<div class="card"><div class="section-title">Add / Edit Flat</div>
<div class="field"><label>Flat Number</label><input id="flatId" placeholder="e.g. 303"></div>
<div class="field"><label>Resident Name</label><input id="residentName" placeholder="Resident name"></div>
<div class="field"><label>PIN</label><input id="residentPin" inputmode="numeric" maxlength="6" placeholder="PIN"></div>
<div class="field"><label>Status</label><select id="flatStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<div class="actions"><button class="btn" onclick="saveFlat()">Save Flat</button><button class="btn2" onclick="clearFlat()">Clear</button></div><div id="flatStatusMsg" class="status muted"></div>
</div>

<div class="card"><div class="section-title">Add Announcement</div>
<div class="field"><label>Title</label><input id="annTitle" placeholder="Announcement title"></div>
<div class="field"><label>Message</label><textarea id="annMessage" placeholder="Announcement message"></textarea></div>
<div class="actions"><button class="btn" onclick="saveAnnouncement()">Publish</button></div><div id="annStatus" class="status muted"></div></div>

<div class="section-title">All Flats</div><div class="card" id="flatList">Loading…</div>
</main></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {getFirestore,collection,getDocs,doc,getDoc,setDoc,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAIPpzzWEOTs5SW_CnV6D2wkc5k2Y5BxIM",authDomain:"srk-sri-sai-heights.firebaseapp.com",projectId:"srk-sri-sai-heights",storageBucket:"srk-sri-sai-heights.firebasestorage.app",messagingSenderId:"501758531689",appId:"1:501758531689:web:d88a6ffbd3409a868ceaf8"};
const db=getFirestore(initializeApp(firebaseConfig));const ADMIN_PIN="9999";const $=id=>document.getElementById(id);

window.adminLogin=()=>{if($("adminPin").value!==ADMIN_PIN){$("loginErr").textContent="Incorrect admin PIN.";$("loginErr").style.display="block";return;}$("login").style.display="none";$("dashboard").style.display="block";loadDashboard();};
window.logout=()=>{$("dashboard").style.display="none";$("login").style.display="flex";$("adminPin").value="";};

window.loadDashboard=async()=>{
 $("flatList").textContent="Loading…";
 try{
  const fs=await getDocs(collection(db,"flats"));let paid=0,pending=0,total=0,rows="";
  const flats=fs.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  for(const f of flats){const ms=await getDoc(doc(db,"maintenance","2026-10_"+f.id));const m=ms.exists()?ms.data():null;const st=m?.status||"not created",amt=Number(m?.amount||0);if(st==="paid"){paid++;total+=amt}if(st==="pending")pending++;const cls=st==="paid"?"paid":st==="pending"?"pending":"vacant";rows+=`<div class="flatrow"><div class="row"><div><b>Flat ${f.id}</b><div class="muted">${esc(f.residentName||"No resident")} · PIN ${esc(f.pin||"—")}</div></div><span class="badge ${cls}">${st.toUpperCase()}</span></div><div class="actions" style="margin-top:7px"><button class="btn2" onclick="editFlat('${esc(f.id)}')">Edit</button></div></div>`;}
  $("totalFlats").textContent=flats.length;$("paidCount").textContent=paid;$("pendingCount").textContent=pending;$("collection").textContent="₹"+total.toLocaleString("en-IN");$("flatList").innerHTML=rows||"No flats found.";
 }catch(e){$("flatList").innerHTML='<span class="err">Error: '+esc(e.message)+'</span>';}
};

window.editFlat=async id=>{const s=await getDoc(doc(db,"flats",id));if(!s.exists())return;const d=s.data();$("flatId").value=id;$("residentName").value=d.residentName||"";$("residentPin").value=d.pin||"";$("flatStatus").value=d.status||"active";window.scrollTo({top:document.body.scrollHeight/3,behavior:"smooth"});};
window.clearFlat=()=>{$("flatId").value="";$("residentName").value="";$("residentPin").value="";$("flatStatus").value="active";};

window.saveFlat=async()=>{
 const id=$("flatId").value.trim().toUpperCase();if(!id){$("flatStatusMsg").textContent="Enter a flat number.";return;}
 try{await setDoc(doc(db,"flats",id),{flatNumber:id,residentName:$("residentName").value.trim(),pin:$("residentPin").value.trim(),status:$("flatStatus").value},{merge:true});if($("flatStatus").value==="active"){const md=doc(db,"maintenance","2026-10_"+id);const existing=await getDoc(md);if(!existing.exists()){await setDoc(md,{flatNumber:id,month:"October 2026",amount:1565,dueDate:"10 Oct 2026",status:"pending"});}}$("flatStatusMsg").textContent="✓ Flat saved and October maintenance checked."; $("flatStatusMsg").className="status ok";await loadDashboard();}
 catch(e){$("flatStatusMsg").textContent="Error: "+e.message;$("flatStatusMsg").className="status err";}
};

window.createBills=async()=>{
 $("actionStatus").textContent="Creating October bills…";
 try{const fs=await getDocs(collection(db,"flats"));let n=0;for(const f of fs.docs){await setDoc(doc(db,"maintenance","2026-10_"+f.id),{flatNumber:f.id,month:"October 2026",amount:1565,dueDate:"10 Oct 2026",status:"pending"},{merge:true});n++;}$("actionStatus").textContent=`✓ ${n} October records created/updated.`;$("actionStatus").className="status ok";await loadDashboard();}
 catch(e){$("actionStatus").textContent="Error: "+e.message;$("actionStatus").className="status err";}
};

window.saveAnnouncement=async()=>{
 const title=$("annTitle").value.trim(),message=$("annMessage").value.trim();if(!title||!message){$("annStatus").textContent="Enter title and message.";return;}
 try{await addDoc(collection(db,"announcements"),{title,message,date:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),createdAt:serverTimestamp()});$("annTitle").value="";$("annMessage").value="";$("annStatus").textContent="✓ Announcement published.";$("annStatus").className="status ok";}
 catch(e){$("annStatus").textContent="Error: "+e.message;$("annStatus").className="status err";}
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script>
</body>
</html>
