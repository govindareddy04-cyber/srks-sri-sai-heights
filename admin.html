<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769e0">
<title>SRK's Sri Sai Heights - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#14213d}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f5f7fb}
.top{background:#1769e0;color:#fff;padding:22px 18px 24px;border-radius:0 0 24px 24px}.top h1{font-size:20px;margin:0 0 4px}.top p{margin:0;font-size:13px;opacity:.9}
.content{padding:15px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0001}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.stat{background:#fff;border-radius:15px;padding:16px;box-shadow:0 2px 10px #0001}.stat b{font-size:24px;display:block;margin-top:5px}.muted{font-size:12px;color:#6d7789}
.section-title{font-size:18px;font-weight:700;margin:8px 0 13px}
.btn{border:0;border-radius:11px;padding:13px 15px;background:#1769e0;color:#fff;font-weight:700;font-size:14px}.btn:disabled{opacity:.5}
.btn2{border:1px solid #d8dee9;border-radius:11px;padding:12px 14px;background:#fff;color:#1769e0;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.flatrow{padding:13px 0;border-bottom:1px solid #edf0f4}.badge{padding:5px 9px;border-radius:18px;font-size:11px;font-weight:700}.paid{background:#def5e5;color:#13813b}.pending{background:#fff0dc;color:#c96400}.vacant{background:#edf0f5;color:#687386}
.actions{display:flex;gap:9px;flex-wrap:wrap}.status{font-size:12px;margin-top:9px}.ok{color:#13813b}.err{color:#b42318}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f5f7fb}.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:27px 22px;box-shadow:0 4px 20px #0001}
.login-logo{width:64px;height:64px;border-radius:18px;background:#1769e0;color:#fff;display:grid;place-items:center;font-size:29px;margin:0 auto 17px}.login h2{text-align:center;margin:0 0 5px}.login-sub{text-align:center;color:#6d7789;font-size:13px;margin-bottom:22px}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #d9dee8;border-radius:11px;font-size:16px}
.login-error{display:none;color:#b42318;font-size:13px;margin:8px 0}
.logout{float:right;border:0;background:#fff;color:#1769e0;font-weight:700;border-radius:8px;padding:7px 10px}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card">
  <div class="login-logo">🔐</div><h2>Admin Dashboard</h2><div class="login-sub">SRK'S SRI SAI HEIGHTS</div>
  <div class="field"><label>Admin PIN</label><input id="adminPin" type="password" inputmode="numeric" placeholder="Enter admin PIN"></div>
  <div id="loginErr" class="login-error"></div>
  <button class="btn" style="width:100%" onclick="adminLogin()">Login</button>
  <div class="muted" style="text-align:center;margin-top:12px">Initial test PIN: 9999</div>
 </div>
</div>

<div id="dashboard" class="app" style="display:none">
 <div class="top"><button class="logout" onclick="logout()">Logout</button><h1>SRK'S SRI SAI HEIGHTS</h1><p>Admin Dashboard</p></div>
 <main class="content">
  <div class="stats">
   <div class="stat"><span class="muted">Total Flats</span><b id="totalFlats">—</b></div>
   <div class="stat"><span class="muted">Paid</span><b id="paidCount">—</b></div>
   <div class="stat"><span class="muted">Pending</span><b id="pendingCount">—</b></div>
   <div class="stat"><span class="muted">Collection</span><b id="collection">₹—</b></div>
  </div>

  <div class="card">
   <div class="section-title">October 2026 Maintenance</div>
   <div class="actions">
    <button class="btn" onclick="createBills()">Create / Update ₹1,565 Bills</button>
    <button class="btn2" onclick="loadDashboard()">Refresh</button>
   </div>
   <div id="actionStatus" class="status muted">Maintenance records are read from Firestore.</div>
  </div>

  <div class="section-title">All Flats</div>
  <div class="card" id="flatList">Loading…</div>
 </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {getFirestore,collection,getDocs,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAIPpzzWEOTs5SW_CnV6D2wkc5k2Y5BxIM",authDomain:"srk-sri-sai-heights.firebaseapp.com",projectId:"srk-sri-sai-heights",storageBucket:"srk-sri-sai-heights.firebasestorage.app",messagingSenderId:"501758531689",appId:"1:501758531689:web:d88a6ffbd3409a868ceaf8"};
const db=getFirestore(initializeApp(firebaseConfig));
const ADMIN_PIN="9999";

window.adminLogin=()=>{
 const p=document.getElementById("adminPin").value;
 if(p!==ADMIN_PIN){const e=document.getElementById("loginErr");e.textContent="Incorrect admin PIN.";e.style.display="block";return;}
 document.getElementById("login").style.display="none";document.getElementById("dashboard").style.display="block";loadDashboard();
};
window.logout=()=>{document.getElementById("dashboard").style.display="none";document.getElementById("login").style.display="flex";document.getElementById("adminPin").value="";};

async function loadDashboard(){
 const list=document.getElementById("flatList");list.textContent="Loading…";
 try{
  const fs=await getDocs(collection(db,"flats"));
  const flats=fs.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  let paid=0,pending=0,total=0,rows="";
  for(const f of flats){
   const ms=await getDoc(doc(db,"maintenance","2026-10_"+f.id));
   const m=ms.exists()?ms.data():null;
   const st=m?.status||"not created";const amt=Number(m?.amount||0);
   if(st==="paid"){paid++;total+=amt;}else if(st==="pending"){pending++;}
   const cls=st==="paid"?"paid":st==="pending"?"pending":"vacant";
   rows+=`<div class="flatrow"><div class="row"><div><b>Flat ${f.id}</b><div class="muted">${f.residentName||"No resident"}</div></div><span class="badge ${cls}">${st.toUpperCase()}</span></div>${m?`<div class="muted" style="margin-top:5px">₹${amt.toLocaleString("en-IN")} · Due ${m.dueDate||"—"}</div>`:""}</div>`;
  }
  document.getElementById("totalFlats").textContent=flats.length;
  document.getElementById("paidCount").textContent=paid;
  document.getElementById("pendingCount").textContent=pending;
  document.getElementById("collection").textContent="₹"+total.toLocaleString("en-IN");
  list.innerHTML=rows||"No flats found.";
 }catch(e){list.innerHTML='<span class="err">Error: '+e.message+'</span>';}
}

window.createBills=async()=>{
 const s=document.getElementById("actionStatus");s.textContent="Creating October bills…";s.className="status muted";
 try{
  const fs=await getDocs(collection(db,"flats"));let n=0;
  for(const f of fs.docs){
   await setDoc(doc(db,"maintenance","2026-10_"+f.id),{flatNumber:f.id,month:"October 2026",amount:1565,dueDate:"10 Oct 2026",status:"pending"});
   n++;
  }
  s.textContent=`✓ Created/updated ${n} October maintenance records at ₹1,565.`;s.className="status ok";await loadDashboard();
 }catch(e){s.textContent="Error: "+e.message;s.className="status err";}
};
</script>
</body>
</html>
